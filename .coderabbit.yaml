# CodeRabbit Configuration
# Schema: https://coderabbit.ai/integrations/coderabbit-overrides.v2.json
version: "2"
language: "en-US"
tone_instructions: "Be concise, analytical, and actionable. Emphasize performance, responsive touchless UX, and adherence to single-finger drawing conventions."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!.agent/**"
    - "!.agents/**"
    - "!scripts/**"
    - "!*.min.js"
    - "!*.min.css"
    - "!cloudflare.log"
    - "!cloudflare.pid"

  path_instructions:
    - path: "index.html"
      instructions: |
        AirDraw Pro is a high-performance touchless air-drawing application running in modern browsers.
        - Strict Rule: Single-finger drawing using the Index fingertip (☝️).
        - Ensure 1-Euro filter sub-pixel coordinates are preserved.
        - Check that MediaPipe Hands CDN scripts load correctly and asynchronously.
        - Verify canvas rendering maintains 60 FPS without memory leaks or unbounded stroke arrays.
        - Ensure accessible DOM overlay and responsive glassmorphic UI.
    - path: "auto-sync.js"
      instructions: |
        Verify file debouncing, safe git commands, and robust stdout/stderr handling.
